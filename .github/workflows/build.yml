workflows:
  android-apk:
    name: Miku APK (Codemagic)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 17
      vars:
        GRADLE_OPTS: "-Xmx2048m"
    scripts:
      - name: scaffold android project
        script: |
          mkdir -p app/src/main/java/app/miku app/src/main/res/values

          cat > settings.gradle <<'EOF'
          include ':app'
          rootProject.name = 'miku'
          EOF

          cat > build.gradle <<'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.5.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          apply plugin: 'com.android.application'
          android {
              namespace 'app.miku'
              compileSdk 34
              defaultConfig {
                  applicationId 'app.miku'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <application
                  android:label="ミク"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/app/miku/MainActivity.java <<'EOF'
          package app.miku;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              static final String URL = "http://127.0.0.1:8772/";

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  WebView w = new WebView(this);
                  w.getSettings().setJavaScriptEnabled(true);
                  w.getSettings().setDomStorageEnabled(true);
                  w.setWebViewClient(new WebViewClient());
                  w.loadUrl(URL);
                  setContentView(w);
              }
          }
          EOF
      - name: build apk
        script: |
          cd android
          gradle assembleDebug --no-daemon || ./gradlew assembleDebug --no-daemon
          find . -name '*.apk' -print
    artifacts:
      - android/app/build/outputs/**/*.apk

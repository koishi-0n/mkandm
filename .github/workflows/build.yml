name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: scaffold android project
        run: |
          set -e
          mkdir -p app/src/main/java/app/miku app/src/main/res/values app/src/main/res/mipmap-anydpi-v26 app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Miku"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          buildscript { repositories { google(); mavenCentral() } }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'app.miku'
              compileSdk 34
              defaultConfig { applicationId 'app.miku' minSdk 26 targetSdk 34 versionCode 1 versionName '1.0' }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17 targetCompatibility JavaVersion.VERSION_17
                                encoding 'UTF-8' }
          }
          tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application android:label="Miku" android:usesCleartextTraffic="true"
                           android:icon="@mipmap/ic_launcher">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".OverlayService" android:exported="false"
                           android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                                android:value="desktop pet overlay"/>
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/app/miku/MainActivity.java <<'EOF'
          package app.miku;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  if (Build.VERSION.SDK_INT >= 23 && !Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "Allow display over other apps", Toast.LENGTH_LONG).show();
                      Intent i = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:" + getPackageName()));
                      startActivity(i);
                  } else {
                      startPet();
                  }
              }

              @Override protected void onResume() {
                  super.onResume();
                  if (Build.VERSION.SDK_INT >= 23 && Settings.canDrawOverlays(this)) startPet();
              }

              private void startPet() {
                  Intent i = new Intent(this, OverlayService.class);
                  if (Build.VERSION.SDK_INT >= 26) startForegroundService(i); else startService(i);
                  Toast.makeText(this, "Miku is out. Drag to move, long-press to talk", Toast.LENGTH_SHORT).show();
                  finish();
              }
          }
          EOF

          cat > app/src/main/java/app/miku/OverlayService.java <<'EOF'
          package app.miku;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.os.Build;
          import android.os.IBinder;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.view.inputmethod.InputMethodManager;
          import android.content.Context;
          import android.os.Handler;
          import android.os.Looper;

          public class OverlayService extends Service {
              private WindowManager wm;
              private WebView view;
              private WindowManager.LayoutParams lp;
              private boolean inputMode = false;

              @Override public IBinder onBind(Intent i) { return null; }

              @Override public void onCreate() {
                  super.onCreate();
                  startForeground(1, notification());
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  view = new WebView(this);
                  view.setBackgroundColor(Color.TRANSPARENT);
                  WebSettings s = view.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  view.loadUrl("http://127.0.0.1:8772/pet.html");
                  view.setFocusable(true);
                  view.setFocusableInTouchMode(true);
                  view.setWebViewClient(new WebViewClient() {
                      @Override public boolean shouldOverrideUrlLoading(WebView v, String url) {
                          if (url.startsWith("mikufocus://")) { setFocusable(url.endsWith("1")); return true; }
                          if (url.startsWith("mikuinput://")) { inputMode = url.endsWith("1"); return true; }
                          return false;
                      }
                      @Override public boolean shouldOverrideUrlLoading(WebView v, android.webkit.WebResourceRequest r) {
                          return shouldOverrideUrlLoading(v, r.getUrl().toString());
                      }
                  });

                  int w = dp(150), h = dp(230);
                  lp = new WindowManager.LayoutParams(
                          w, h,
                          Build.VERSION.SDK_INT >= 26
                                  ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                                  : WindowManager.LayoutParams.TYPE_PHONE,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.TRANSLUCENT);
                  lp.gravity = Gravity.TOP | Gravity.START;
                  lp.x = 40; lp.y = 600;

                  final Handler main = new Handler(Looper.getMainLooper());
                  view.setOnTouchListener(new View.OnTouchListener() {
                      float downX, downY; int startX, startY; long t0;
                      boolean moved = false;
                      long lastTap = 0;
                      final Runnable longPress = new Runnable() {
                          @Override public void run() {
                              if (moved) return;
                              // 长按不动 → 让网页在她头顶弹出键盘按钮
                              view.evaluateJavascript(
                                      "window.showKeyBtn && window.showKeyBtn()", null);
                              try { view.performHapticFeedback(
                                      android.view.HapticFeedbackConstants.LONG_PRESS); } catch (Exception ignored) {}
                          }
                      };
                      @Override public boolean onTouch(View v, MotionEvent e) {
                          if (inputMode) return false;   // 正在打字时把触摸还给网页
                          switch (e.getActionMasked()) {
                              case MotionEvent.ACTION_DOWN:
                                  downX = e.getRawX(); downY = e.getRawY();
                                  startX = lp.x; startY = lp.y; t0 = System.currentTimeMillis();
                                  moved = false;
                                  main.postDelayed(longPress, 500);
                                  return true;
                              case MotionEvent.ACTION_MOVE:
                                  int dx = (int) (e.getRawX() - downX);
                                  int dy = (int) (e.getRawY() - downY);
                                  if (!moved && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) {
                                      moved = true; main.removeCallbacks(longPress);
                                  }
                                  if (moved) {
                                      lp.x = startX + dx;
                                      lp.y = startY + dy;
                                      wm.updateViewLayout(view, lp);
                                  }
                                  return true;
                              case MotionEvent.ACTION_UP:
                                  main.removeCallbacks(longPress);
                                  if (!moved && System.currentTimeMillis() - t0 < 500) {
                                      long now = System.currentTimeMillis();
                                      if (now - lastTap < 360) {   // 双击收起，免得她赖在桌面上
                                          stopSelf();
                                      } else {
                                          lastTap = now;
                                          Toast.makeText(OverlayService.this,
                                                  "long-press=talk  double-tap=close  drag=move",
                                                  Toast.LENGTH_SHORT).show();
                                      }
                                  }
                                  return true;
                              case MotionEvent.ACTION_CANCEL:
                                  main.removeCallbacks(longPress);
                                  return true;
                          }
                          return false;
                      }
                  });
                  wm.addView(view, lp);
              }

              private void setFocusable(final boolean on) {
                  if (on) lp.flags = WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS;
                  else lp.flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                          | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS;
                  try { wm.updateViewLayout(view, lp); } catch (Exception ignored) {}
                  view.postDelayed(new Runnable() {
                      @Override public void run() {
                          InputMethodManager im = (InputMethodManager) getSystemService(Context.INPUT_METHOD_SERVICE);
                          if (on) { view.requestFocus(); im.showSoftInput(view, 0); }
                          else { im.hideSoftInputFromWindow(view.getWindowToken(), 0); view.clearFocus(); }
                      }
                  }, 150);
              }

              private Notification notification() {
                  String ch = "miku";
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                      NotificationChannel c = new NotificationChannel(ch, "Miku", NotificationManager.IMPORTANCE_MIN);
                      nm.createNotificationChannel(c);
                  }
                  Notification.Builder b = Build.VERSION.SDK_INT >= 26
                          ? new Notification.Builder(this, ch) : new Notification.Builder(this);
                  return b.setContentTitle("Miku").setSmallIcon(android.R.drawable.ic_menu_view)
                          .setOngoing(true).build();
              }

              private int dp(int v) {
                  return (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v,
                          getResources().getDisplayMetrics());
              }

              @Override public void onDestroy() {
                  if (view != null && wm != null) { try { wm.removeView(view); } catch (Exception ignored) {} }
                  super.onDestroy();
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources></resources>
          EOF

      - name: icons
        run: |
          set -e
          which convert || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi \
                   app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}
            convert -size ${s}x${s} xc:'#0C1016' \
              -fill '#7EE7C8' -draw "circle $((s/2)),$((s/2)) $((s/2)),$((s/5))" \
              "app/src/main/res/mipmap-$d/ic_launcher.png"
          done

      - name: build apk
        run: |
          set -e
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: miku-pet-apk
          path: app/build/outputs/apk/debug/app-debug.apk
